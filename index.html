<style>
:root{--oro:#D99A0B;--oro2:#F5C542;--verde:#2F5D3A;--crema:#FBF6EA;--papel:#fff;--tinta:#2B2418;--gris:#7A705F;--linea:#E9DFC7;--rojo:#B9442F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--crema);color:var(--tinta);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--verde);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px;font-weight:800}
header .sub{font-size:13px;opacity:.85}
main{max-width:640px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--papel);border-top:1px solid var(--linea);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:8px 2px 9px;color:var(--gris);text-decoration:none;font-size:11.5px;font-weight:700}

.muted{color:var(--gris);font-size:14px}.small{font-size:13px}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:800;cursor:pointer;background:var(--oro);color:#fff;width:100%;margin-top:8px;display:block;text-align:center;text-decoration:none}
.btn:disabled{opacity:.55}
.btn.verde{background:var(--verde)}.btn.claro{background:#F3EBD6;color:var(--tinta)}
.btn.borde{background:transparent;border:2px solid var(--linea);color:var(--tinta)}
.btn.rojo{background:transparent;border:2px solid #EBC7BF;color:var(--rojo)}
.row{display:flex;gap:8px}.row>*{flex:1}
.pill{display:inline-block;background:#F3EBD6;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;color:#6B5A2E;margin-right:4px}
.pill.v{background:#DCEBDD;color:var(--verde)}.pill.r{background:#F6DED8;color:var(--rojo)}
textarea,input,select{width:100%;font:inherit;padding:10px 11px;border-radius:10px;border:1px solid var(--linea);background:#fff;color:var(--tinta)}
textarea{min-height:110px;resize:vertical}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid .it{position:relative;cursor:pointer}
.grid .it img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;display:block;background:#EFE6CF}
.grid .it .lab{font-size:11.5px;font-weight:700;line-height:1.2;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid .it .n{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:8px;padding:1px 6px}
.dia{font-weight:800;margin:16px 0 6px;color:var(--verde);text-transform:capitalize}
.post{display:flex;gap:10px;align-items:flex-start;background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:10px;margin-bottom:8px;cursor:pointer}
.post img{width:62px;height:62px;border-radius:10px;object-fit:cover;flex:none;background:#EFE6CF}
.post .bd{flex:1;min-width:0}.post .t1{font-weight:800;font-size:14px}
.post .t2{font-size:13px;color:var(--gris);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.post.hecha{opacity:.6}
.aviso{background:#FFF4D6;border:1px solid #F0D58A;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.paso{display:flex;gap:10px;align-items:center;margin-top:8px}
.paso b.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.paso .btn{margin-top:0}
.big{font-size:28px;font-weight:800;color:var(--verde);line-height:1.1}
.metric{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.metric input{padding:8px 6px;text-align:center}
.metric span{display:block;font-size:11px;text-align:center;color:var(--gris);margin-top:2px}
.modal{position:fixed;inset:0;background:rgba(30,25,15,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--crema);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.fb{background:#fff;border:1px solid #DADDE1;border-radius:10px;overflow:hidden;color:#050505}
.fbh{display:flex;gap:8px;align-items:center;padding:10px 12px 6px}.fbh b{font-size:15px}
.av{width:40px;height:40px;border-radius:50%;background:var(--oro2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.fbm{font-size:12.5px;color:#65676B}
.fbt{padding:2px 12px 0;font-size:15px;white-space:pre-wrap;line-height:1.35}
.fbt.corto{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vermas{appearance:none;border:0;background:none;color:#65676B;font-weight:700;font-size:14px;padding:2px 12px 8px;cursor:pointer;font-family:inherit}
.fb img{width:100%;display:block;max-height:520px;object-fit:cover;background:#EFE6CF}
.fbbar{display:flex;justify-content:space-around;border-top:1px solid #E4E6EB;padding:8px 4px;font-size:13.5px;color:#65676B;font-weight:600}
.frase{display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid var(--linea);padding:8px 0;font-size:14px;white-space:pre-wrap}
.frase span{flex:1}.frase button{appearance:none;border:0;background:#F6DED8;color:var(--rojo);border-radius:8px;padding:4px 9px;cursor:pointer;font:inherit;font-size:13px}
.hora-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hora-row input{width:auto;flex:none}
.hora-row button{appearance:none;border:0;background:#F3EBD6;border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit}
.guia li{margin-bottom:8px}
.hidden{display:none!important}
.subnav{display:flex;gap:6px;overflow-x:auto;margin:-2px 0 12px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.subnav a{flex:none;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--linea);text-decoration:none;color:var(--tinta);font-weight:700;font-size:13px}
.subnav a.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.barra{height:10px;border-radius:6px;background:#F3EBD6;overflow:hidden}.barra div{height:100%;background:var(--verde)}
.agenda{display:flex;gap:10px;align-items:center;border-top:1px solid var(--linea);padding:9px 0}
.agenda .bd{flex:1;min-width:0;font-size:14px}.agenda.lista .bd{opacity:.55}
.agenda .chk{appearance:none;flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--linea);background:#fff;color:var(--verde);font-weight:800;cursor:pointer}
.agenda.lista .chk{background:#DCEBDD;border-color:#DCEBDD}
.agenda .mini{appearance:none;flex:none;border:0;border-radius:10px;background:var(--oro);color:#fff;font-weight:800;padding:8px 11px;font:inherit;font-size:13px;cursor:pointer}
.caja{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.caja button{appearance:none;border:1px solid var(--linea);background:#fff;border-radius:12px;padding:10px 4px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--tinta)}
.caja button b{display:block;font-size:22px;color:var(--verde)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.kpis div{background:#FFFCF3;border:1px solid var(--linea);border-radius:12px;padding:10px}
.kpis b{display:block;font-size:24px;color:var(--verde)}.kpis span{font-size:12.5px;color:var(--gris)}
.dias{display:flex;flex-wrap:wrap;gap:8px}.dias label{display:flex;gap:4px;align-items:center;font-weight:600;margin:4px 0}.dias input{width:auto}
</style>

<body>
<header><h1>🌽 Espiga Social</h1><div class="sub" id="hdrSub"></div></header>
<main id="app"><div class="card muted">Cargando…</div></main>
<nav>
  <a href="#hoy" data-v="hoy"><span class="ic">✅</span>Hoy</a>
  <a href="#canales" data-v="canales"><span class="ic">👥</span>Grupos</a>
  <a href="#resultados" data-v="resultados"><span class="ic">📊</span>Resultados</a>
  <a href="#mas" data-v="mas"><span class="ic">⚙️</span>Más</a>
</nav>
<input type="file" id="fileIn" accept="image/*" multiple class="hidden">
<input type="file" id="restIn" accept=".json,application/json" class="hidden">
<input type="file" id="tarIn" accept="image/*" multiple class="hidden">
<input type="file" id="pkgIn" accept=".json,.txt,application/json,text/plain" class="hidden">

<script src="facebook.js"></script>
<script src="marketing.js"></script>

<script>
"use strict";
/* ===================== Datos por defecto ===================== */
const DEFAULT_CFG = {
  nombre: "Tortillería La Espiga Dorada",
  ciudad: "Macuspana, Tabasco",
  direccion: "Cerrada a un costado de Del Sol, detrás de El Changarreo, frente a La Placita",
  whatsapp: "936 106 0987",
  horario: "de 6:00 am a 6:30 pm",
  hashtags: "#Macuspana #MacuspanaTabasco #Tabasco #TortilleriaLaEspigaDorada #ComercioLocal",
  horarios: ["07:30", "11:30", "16:30"],
  horarioDomingo: ["10:00"],
  probPregunta: 30
};
const PRODUCTO_DEF = { tortilla: "tortillas", huevo: "huevo Calvario", lacteos: "lácteos Lala", pan: "pan Bimbo", botanas: "botanas", refrescos: "refrescos", granos: "granos por kilo y bulto", despensa: "productos de despensa", hogar: "artículos para el hogar", general: "todo lo que necesitas" };
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

/* ===================== Almacenamiento (IndexedDB) ===================== */
let IDB = null;
function abrirDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open("espiga-social", 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("kv"); d.createObjectStore("fotos", { keyPath: "id" }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn){
  return new Promise((res, rej) => {
    const t = IDB.transaction(store, mode), s = t.objectStore(store); let out;
    const r = fn(s); if (r) r.onsuccess = () => out = r.result;
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const kvGet = k => tx("kv", "readonly", s => s.get(k));
const kvSet = (k, v) => tx("kv", "readwrite", s => s.put(v, k));
const fotosAll = () => tx("fotos", "readonly", s => s.getAll());
const fotoPut = f => tx("fotos", "readwrite", s => s.put(f));
const fotoDel = id => tx("fotos", "readwrite", s => s.delete(id));

/* ===================== Estado ===================== */
const S = { cfg: null, banco: null, posts: [], usados: [], fotos: [], urls: {}, editing: null, openPid: null };
const $app = document.getElementById("app");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
async function guardarPosts(){ await kvSet("posts", S.posts); }
async function guardarCfg(){ await kvSet("cfg", S.cfg); }
async function guardarBanco(){ await kvSet("banco", S.banco); }

/* ===================== Utilidades ===================== */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const fechaBonita = s => { const d = parseYmd(s); return DIAS[d.getDay()] + " " + d.getDate() + " " + MESES[d.getMonth()]; };
const hoyStr = () => ymd(new Date());
const ahoraHM = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const dt = p => { const d = parseYmd(p.fecha); const [h,m] = p.hora.split(":").map(Number); d.setHours(h, m, 0, 0); return d; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const fotoById = id => S.fotos.find(f => f.id === id);
const urlFoto = f => { if (!f) return ""; if (!S.urls[f.id]) S.urls[f.id] = URL.createObjectURL(f.blob); return S.urls[f.id]; };
function toast(msg, ms = 2400){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function modal(html){
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = '<div class="sheet">' + html + '</div>';
  m.addEventListener("click", e => { if (e.target === m) cerrarModal(m); });
  document.body.appendChild(m); return m;
}
function cerrarModal(m){ m.remove(); S.openPid = null; S.editing = null; }
function confirmar(msg, ok = "Sí, continuar"){
  return new Promise(res => {
    const m = modal('<p style="font-weight:700;margin-top:0">' + esc(msg) + '</p><div class="row"><button class="btn borde" data-r="0">Cancelar</button><button class="btn rojo" data-r="1">' + esc(ok) + '</button></div>');
    m.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { m.remove(); res(b.dataset.r === "1"); });
  });
}
async function copiar(text){
  try { await navigator.clipboard.writeText(text); toast("✅ Texto copiado"); }
  catch(e){
    const m = modal('<h3 style="margin-top:0">Copia el texto</h3><p class="muted small">Mantén presionado el texto → "Seleccionar todo" → "Copiar".</p><textarea readonly style="min-height:220px">' + esc(text) + '</textarea><button class="btn claro">Listo</button>');
    const ta = m.querySelector("textarea"); ta.focus(); ta.select(); m.querySelector("button").onclick = () => m.remove();
  }
}
function descargar(nombre, blob){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function usoFoto(fid){ let n = 0, ult = null; for (const p of S.posts) if (p.fotoId === fid && p.estado !== "omitida") { n++; if (!ult || p.fecha > ult) ult = p.fecha; } return { n, ult }; }

/* ===================== Productos ===================== */
const prodDe = f => f && f.prod && S.banco.productos && S.banco.productos[f.prod] ? S.banco.productos[f.prod] : null;
function adivinarProd(texto, categoria){
  const t = " " + String(texto || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") + " ";
  for (const [k, p] of Object.entries(S.banco.productos || {})) if ((p.claves || []).some(c => t.includes(c.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")))) return k;
  return ({ tortilla: "tortilla", huevo: "huevo", general: "tienda" })[categoria] || "";
}
function nombreFoto(f){ const p = prodDe(f); return f.producto || (p ? p.nombre : S.banco.categorias[f.categoria] || ""); }
function opcionesProd(sel){
  const P = S.banco.productos, grupos = {};
  Object.entries(P).forEach(([k, p]) => (grupos[p.cat] = grupos[p.cat] || []).push([k, p]));
  return '<option value="">— Elige el producto —</option>' + Object.entries(grupos).map(([cat, l]) => '<optgroup label="' + esc((S.banco.categorias[cat] || cat).split(" (")[0]) + '">' + l.map(([k, p]) => '<option value="' + k + '"' + (k === sel ? " selected" : "") + '>' + esc(p.nombre) + '</option>').join("") + '</optgroup>').join("");
}

/* ===================== Combinador de frases ===================== */
function momento(hora){ const h = Number(hora.slice(0, 2)); return h < 10 ? "manana" : h < 14 ? "mediodia" : "tarde"; }
function pascua(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1; return new Date(y, mes-1, dia); }
function fechasActivas(fecha){
  const d = parseYmd(fecha), md = pad(d.getMonth()+1) + "-" + pad(d.getDate());
  const ultimo = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  return (S.banco.fechas || []).filter(f => {
    if (f.id === "quincena") return [14,15,16].includes(d.getDate()) || d.getDate() >= ultimo - 1 || d.getDate() === 1;
    if (f.id === "cuaresma") { const p = pascua(d.getFullYear()); const ini = new Date(p); ini.setDate(p.getDate() - 46); const fin = new Date(p); fin.setDate(p.getDate() - 3); return d >= ini && d <= fin; }
    if (!f.desde || !f.hasta) return false;
    return f.desde <= f.hasta ? (md >= f.desde && md <= f.hasta) : (md >= f.desde || md <= f.hasta);
  });
}
function elegirFrase(lista){
  if (!lista || !lista.length) return "";
  const libres = lista.filter(t => !S.usados.includes(t));
  const t = pick(libres.length ? libres : lista);
  S.usados.push(t); if (S.usados.length > 40) S.usados = S.usados.slice(-40);
  return t;
}
function rellenar(t, foto){
  const c = S.cfg, cat = foto ? foto.categoria || "general" : "general";
  const pr = prodDe(foto);
  return t.replace(/\{producto\}/g, (foto && foto.producto) || (pr && pr.nombre) || PRODUCTO_DEF[cat] || "nuestros productos")
    .replace(/\{nombre\}/g, c.nombre).replace(/\{ciudad\}/g, c.ciudad).replace(/\{direccion\}/g, c.direccion)
    .replace(/\{whatsapp\}/g, c.whatsapp).replace(/\{horario\}/g, c.horario);
}
function componer(fecha, hora, foto){
  const B = S.banco, cat = foto ? foto.categoria || "general" : "general", pr = prodDe(foto);
  const ganchos = B.ganchos.filter(g => g.m === momento(hora) || g.m === "*").map(g => g.t);
  const partes = [];
  // Productos específicos usan su propia primera línea; tortilla y tienda mezclan con las generales.
  const mezcla = !pr || pr.cat === "tortilla" || pr.cat === "general";
  partes.push(pr && pr.ganchos && pr.ganchos.length && (!mezcla || Math.random() < 0.5) ? elegirFrase(pr.ganchos) : elegirFrase(ganchos));
  const esp = fechasActivas(fecha);
  if (esp.length && Math.random() < 0.75) partes.push(elegirFrase(pick(esp).frases));
  partes.push(elegirFrase(pr && pr.frases && pr.frases.length ? pr.frases : B.cuerpos[cat] && B.cuerpos[cat].length ? B.cuerpos[cat] : B.cuerpos.general));
  if (Math.random() * 100 < (S.cfg.probPregunta ?? 30)) partes.push(elegirFrase(B.preguntas));
  partes.push(elegirFrase(B.cierres));
  const tags = (S.cfg.hashtags + " " + ((pr && pr.tags) || B.tagsCategoria[cat] || "")).trim();
  return partes.filter(Boolean).map(t => rellenar(t, foto)).join("\n\n") + "\n\n" + tags;
}

/* ===================== Programación ===================== */
function elegirFotos(n){
  const uso = {}; S.fotos.forEach(f => uso[f.id] = usoFoto(f.id));
  const hace7 = (() => { const d = new Date(); d.setDate(d.getDate() - 7); return ymd(d); })();
  const res = []; let prev = null;
  for (let i = 0; i < n; i++) {
    let c = S.fotos.filter(f => !prev || (f.id !== prev.id && f.categoria !== prev.categoria));
    if (!c.length) c = S.fotos.filter(f => !prev || f.id !== prev.id);
    if (!c.length) c = S.fotos.slice();
    const w = c.map(f => { const u = uso[f.id]; let x = 1 / (1 + u.n); if (u.ult && u.ult >= hace7) x *= 0.25; if (f.categoria === "tortilla") x *= 1.5; if (S.mkt && S.mkt.retirados && S.mkt.retirados[f.prod] > hoyStr()) x *= 0.02; return x; });
    let r = Math.random() * w.reduce((a,b) => a+b, 0), k = 0;
    while (k < c.length - 1 && (r -= w[k]) > 0) k++;
    res.push(c[k]); prev = c[k]; uso[c[k].id] = { n: uso[c[k].id].n + 1, ult: hoyStr() };
  }
  return res;
}
async function programar(desde, dias){
  if (!S.fotos.length) { toast("Primero agrega fotos"); return; }
  const cambio = await ajustarHorarios();
  if (cambio) toast("📈 Horarios ajustados según tus resultados: " + cambio.despues.join(", "), 5000);
  const ocup = new Set(S.posts.filter(p => p.estado !== "omitida").map(p => p.fecha + " " + p.hora));
  const now = new Date(), slots = [];
  for (let i = 0; i < dias; i++) {
    const d = parseYmd(desde); d.setDate(d.getDate() + i);
    for (const h of (d.getDay() === 0 ? S.cfg.horarioDomingo : S.cfg.horarios) || []) {
      const s = { fecha: ymd(d), hora: h }; if (dt(s) > now && !ocup.has(s.fecha + " " + h)) slots.push(s);
    }
  }
  if (!slots.length) { toast("No hay horarios libres en esas fechas"); return; }
  const fotos = elegirFotos(slots.length);
  slots.forEach((s, i) => S.posts.push({ id: uid(), fecha: s.fecha, hora: s.hora, fotoId: fotos[i].id, texto: componer(s.fecha, s.hora, fotos[i]), estado: "pendiente", resultados: null }));
  S.posts.sort((a,b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
  await guardarPosts(); await kvSet("usados", S.usados);
  toast("✅ " + slots.length + " publicaciones programadas"); render();
}

function icsTexto(posts){
  const f = d => d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00";
  const escI = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const st = new Date(), stamp = st.getUTCFullYear() + pad(st.getUTCMonth()+1) + pad(st.getUTCDate()) + "T" + pad(st.getUTCHours()) + pad(st.getUTCMinutes()) + "00Z";
  let s = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Espiga Social//ES\r\nCALSCALE:GREGORIAN\r\n";
  posts.forEach(p => {
    const d = dt(p), e = new Date(d.getTime() + 15*60000);
    s += "BEGIN:VEVENT\r\nUID:" + p.id + "@espiga-social\r\nDTSTAMP:" + stamp + "\r\nDTSTART:" + f(d) + "\r\nDTEND:" + f(e) + "\r\nSUMMARY:" + escI("📣 Publicar en Facebook") + "\r\nDESCRIPTION:" + escI("Abre Espiga Social: la foto y el texto ya están listos.\n\n" + p.texto.split("\n")[0]) + "\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:" + escI("Publicar en Facebook") + "\r\nTRIGGER:PT0M\r\nEND:VALARM\r\nEND:VEVENT\r\n";
  });
  return s + "END:VCALENDAR\r\n";
}
function exportarCalendario(posts){
  if (!posts.length) { toast("No hay publicaciones pendientes"); return; }
  descargar("espiga-publicaciones.ics", new Blob([icsTexto(posts)], { type: "text/calendar" }));
  toast("Ábrelo y toca \"Agregar todo\" en tu calendario", 3500);
}

async function comprimir(file){
  let src, w, h, url = null;
  try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); w = src.width; h = src.height; }
  catch(e){ url = URL.createObjectURL(file); src = await new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = j; i.src = url; }); w = src.naturalWidth; h = src.naturalHeight; }
  const k = Math.min(1, 1600 / Math.max(w, h)), c = document.createElement("canvas");
  c.width = Math.round(w*k); c.height = Math.round(h*k); c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  if (url) URL.revokeObjectURL(url);
  return await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
}
async function onFiles(ev){
  const files = [...ev.target.files]; ev.target.value = ""; if (!files.length) return;
  const nuevas = [];
  for (let i = 0; i < files.length; i++) {
    toast("Guardando foto " + (i+1) + " de " + files.length + "…", 1200);
    try { const blob = await comprimir(files[i]); const f = { id: uid(), blob, categoria: "general", producto: "", creada: new Date().toISOString() }; await fotoPut(f); S.fotos.unshift(f); nuevas.push(f); }
    catch(e){ toast("No se pudo guardar " + (files[i].name || "una foto")); }
  }
  render();
  if (nuevas.length) etiquetar(nuevas, 0);
}

const RUTAS = { hoy: [], plan: [], canales: [["grupos", "👥 Grupos"], ["promos", "🏷️ Promos"]], resultados: [], mas: [["negocio", "🏪 Negocio"], ["fotos", "📷 Fotos"], ["frases", "✍️ Frases"], ["conexiones", "🔌 Conexiones"], ["respaldo", "💾 Respaldo y guía"]] };

  let [main, sub] = h.split("-"); if (!RUTAS[main]) main = "hoy";
  const subs = RUTAS[main]; if (subs.length && !subs.some(x => x[0] === sub)) sub = subs[0][0];

const IA_DEF = {
  gemini: { nombre: "Gemini (Google)", modelo: "gemini-flash-latest", ayuda: "Saca tu clave gratis en aistudio.google.com → \"Get API key\"." },
  claude: { nombre: "Claude (Anthropic)", modelo: "claude-haiku-5-5", ayuda: "Saca tu clave en console.anthropic.com (se paga por uso)." },
  openai: { nombre: "ChatGPT (OpenAI)", modelo: "gpt-5-mini", ayuda: "Saca tu clave en platform.openai.com (se paga por uso)." },
  otro:   { nombre: "Otra IA (compatible con OpenAI)", modelo: "", ayuda: "Escribe la dirección (URL base) y el modelo que te indique el proveedor." }
};
const iaLista = () => !!(S.ia && S.ia.clave && IA_DEF[S.ia.proveedor]);
const esperar = ms => new Promise(r => setTimeout(r, ms));
const blobABase64 = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r({ mime: b.type || "image/jpeg", data: String(fr.result).split(",")[1] }); fr.readAsDataURL(b); });
function iaMsgError(status, msg){
  if (status === 429) return "Se alcanzó el límite de la IA (por minuto o del día). Espera un rato e intenta de nuevo.";
  if (status === 401 || status === 403) return "La clave no es válida o no tiene permiso. Revísala en Más → Conexiones.";
  if (status === 404) return "Ese modelo no existe. Revisa el nombre del modelo en Más → Conexiones.";
  if (status === 400) return "La IA rechazó la petición: " + (msg || "revisa la clave y el modelo") + ".";
  if (status >= 500) return "El servicio de IA está saturado o fallando en este momento. Intenta en unos minutos." + (msg ? " (Detalle: " + msg + ")" : "");
  return msg || "No se pudo hablar con la IA.";
}
function limpiarClave(t){
  // Quita espacios, saltos de línea, comillas y caracteres invisibles que a veces se pegan al copiar.
  let k = String(t || "").replace(/[\s ​-‍⁠﻿"'“”‘’]/g, "");
  if (k.length % 2 === 0 && k.length > 20 && k.slice(0, k.length / 2) === k.slice(k.length / 2)) k = k.slice(0, k.length / 2); // pegada dos veces
  return k;
}
const GEMINI_MODELOS = ["gemini-flash-latest", "gemini-flash-lite-latest", "gemini-2.5-flash", "gemini-2.5-flash-lite"];
async function geminiLlamar(prompt, imgs, json){
  // Prueba el modelo elegido y, si está saturado o no existe, otros modelos Flash; recuerda el que funcionó.
  const lista = [...new Set([S.ia.modelo, S.ia.modeloOk, ...GEMINI_MODELOS].filter(Boolean))];
  let ultimo = null;
  for (const modelo of lista) {
    for (let intento = 0; intento < 2; intento++) {
      let r;
      try {
        r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(modelo) + ":generateContent?key=" + encodeURIComponent(S.ia.clave), { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }, ...imgs.map(i => ({ inline_data: { mime_type: i.mime, data: i.data } }))] }], generationConfig: json ? { responseMimeType: "application/json" } : {} }) });
      } catch(e){
        // Error de red: reintenta una vez y luego prueba otro modelo.
        ultimo = { red: true, msg: (e && e.message) || "" };
        if (intento === 0) { await esperar(2000); continue; }
        break;
      }
      const j = await r.json().catch(() => ({}));
      if (r.ok) {
        if (S.ia.modeloOk !== modelo) { S.ia.modeloOk = modelo; kvSet("ia", S.ia).catch(() => {}); }
        return ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).map(x => x.text || "").join("");
      }
      ultimo = { status: r.status, msg: (j.error && j.error.message) || "" };
      if (r.status === 401 || r.status === 403 || r.status === 429 || (r.status === 400 && !/model/i.test(ultimo.msg))) throw ultimo;
      if (r.status >= 500 && intento === 0) { await esperar(2500); continue; }
      break; // 404 o error de modelo: probar el siguiente
    }
  }
  if (ultimo && ultimo.red) throw ultimo;
  throw ultimo || { status: 0, msg: "" };
}
async function iaLlamar(prompt, opts = {}){
  if (!iaLista()) throw new Error("No hay IA conectada.");
  const p = S.ia.proveedor, modelo = S.ia.modelo || IA_DEF[p].modelo, imgs = [];
  for (const b of opts.images || []) imgs.push(await blobABase64(b));
  let r, j, text = "";
  try {
    if (p === "gemini") {
      text = await geminiLlamar(prompt, imgs, opts.json);
    } else if (p === "claude") {
      r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "content-type": "application/json", "x-api-key": S.ia.clave, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: modelo, max_tokens: 8000, messages: [{ role: "user", content: [...imgs.map(i => ({ type: "image", source: { type: "base64", media_type: i.mime, data: i.data } })), { type: "text", text: prompt }] }] }) });
      j = await r.json().catch(() => ({}));
      if (!r.ok) throw { status: r.status, msg: j.error && j.error.message };
      text = (j.content || []).filter(c => c.type === "text").map(c => c.text).join("");
    } else {
      const base = p === "openai" ? "https://api.openai.com/v1" : String(S.ia.url || "").replace(/\/+$/, "");
      if (!base) throw { status: 0, msg: "Falta la dirección (URL) de la IA." };
      const content = imgs.length ? [{ type: "text", text: prompt }, ...imgs.map(i => ({ type: "image_url", image_url: { url: "data:" + i.mime + ";base64," + i.data } }))] : prompt;
      r = await fetch(base + "/chat/completions", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + S.ia.clave }, body: JSON.stringify({ model: modelo, messages: [{ role: "user", content }] }) });
      j = await r.json().catch(() => ({}));
      if (!r.ok) throw { status: r.status, msg: j.error && j.error.message };
      text = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
    }
  } catch(e){
    if (e && e.status !== undefined) throw new Error(iaMsgError(e.status, e.msg) + (e.status ? " [código " + e.status + "]" : ""));
    const det = (e && (e.msg || e.message)) || "";
    throw new Error("No se pudo llegar al servidor de la IA. Revisa tu internet o intenta en unos minutos." + (det ? " (Detalle: " + det + ")" : ""));
  }
  if (!text.trim()) throw new Error("La IA no respondió nada. Intenta de nuevo.");
  if (opts.json) { const a = text.indexOf("{"), b = text.lastIndexOf("}"); try { return JSON.parse(text.slice(a, b + 1)); } catch(e){ throw new Error("La IA respondió en un formato raro. Intenta de nuevo."); } }
  return text.trim();
}

function envolver(g, texto, maxW){

    if (reel && p.guion) h += '<details style="margin-top:8px"><summary class="small" style="font-weight:700;cursor:pointer">🎥 ¿Prefieres grabarlo tú? Ver guion</summary><div class="small" style="white-space:pre-wrap;margin-top:6px">' + esc(p.guion) + '</div></details>';
    h += '<button class="btn verde" data-act="hecha">✔ Ya lo publiqué</button><div class="row"><button class="btn borde" data-act="editar">✏️ Editar</button><button class="btn rojo" data-act="omitir">Omitir</button></div>';
  }
  if (p.estado === "publicada") {
    const r = p.resultados || {};
    h += '<div style="margin-top:12px"><h3>📊 ¿Cómo le fue?</h3><div class="metric">';
    [["alcance","Alcance"],["reacciones","Reacc."],["comentarios","Coment."],["compartidos","Compart."],["mensajes","Mensajes"]].forEach(([k,l]) => h += '<div><input type="number" inputmode="numeric" min="0" data-met="' + k + '" value="' + (r[k] ?? "") + '"><span>' + l + '</span></div>');
    h += '</div><button class="btn claro" data-act="res">Guardar resultados</button>' + (iaLista() ? '<button class="btn borde" data-act="capRes">📷 Leer de una captura</button>' : '') + '</div>';
  }
  if (p.estado !== "pendiente") h += '<button class="btn borde" data-act="reabrir">Regresar a pendiente</button>';
  return h + '</div>';
}

/* ===================== Ajuste automático de horarios ===================== */
const HORAS_PRUEBA = ["06:30","07:00","07:30","08:00","09:00","10:00","11:00","11:30","12:00","12:30","13:00","14:00","15:00","16:00","16:30","17:00","17:30"];
const minutos = h => { const [a, b] = h.split(":").map(Number); return a * 60 + b; };
function statsHoras(){
  const g = {};
  S.posts.filter(p => p.estado === "publicada" && p.resultados && p.resultados.alcance != null && parseYmd(p.fecha).getDay() !== 0)
    .forEach(p => { g[p.hora] = g[p.hora] || { n: 0, a: 0 }; g[p.hora].n++; g[p.hora].a += p.resultados.alcance || 0; });
  Object.values(g).forEach(v => v.prom = v.a / v.n);
  return g;
}
async function ajustarHorarios(){
  if (S.cfg.autoHorarios === false) return null;
  const st = statsHoras(), total = Object.values(st).reduce((a, v) => a + v.n, 0);
  if (total < 10) return null;
  const N = Math.max(1, S.cfg.horarios.length);
  const probadas = Object.entries(st).filter(([, v]) => v.n >= 2).sort((a, b) => b[1].prom - a[1].prom).map(([h]) => h);
  const quedan = probadas.slice(0, Math.max(1, N - 1));
  for (const h of S.cfg.horarios) if (quedan.length < Math.max(1, N - 1) && !quedan.includes(h)) quedan.push(h);
  let nuevo = quedan.slice();
  if (N > 1) {
    const libres = HORAS_PRUEBA.filter(h => !nuevo.includes(h) && !(st[h] && st[h].n >= 2) && nuevo.every(x => Math.abs(minutos(x) - minutos(h)) >= 60));
    nuevo.push(libres.length ? pick(libres) : probadas.find(h => !nuevo.includes(h)) || S.cfg.horarios.find(h => !nuevo.includes(h)));
  }
  nuevo = [...new Set(nuevo.filter(Boolean))].sort();
  if (nuevo.join() === S.cfg.horarios.join()) return null;
  const cambio = { fecha: new Date().toISOString(), antes: S.cfg.horarios.slice(), despues: nuevo, mejor: probadas[0] || "" };
  S.cfg.horarios = nuevo; await guardarCfg();
  const log = (await kvGet("ajustes")) || []; log.push(cambio); await kvSet("ajustes", log.slice(-20)); S.ajustes = log.slice(-20);
  return cambio;
}

/* ===================== Paquetes de frases (hechos con Claude) ===================== */
function abrirImportar(){
  const m = modal('<h3 style="margin-top:0">📥 Importar paquete de frases</h3><p class="muted small">Los paquetes se generan con la IA en la app de Claude (Ideas → Paquete de frases) o pidiéndoselos a Claude en el chat. Las frases nuevas se <b>agregan</b> a las que ya tienes; las repetidas se ignoran.</p><button class="btn verde" data-x="file">Elegir archivo del paquete</button><label>…o pega aquí el texto del paquete</label><textarea id="pkgTxt" placeholder=\'{"app":"espiga-frases", ...}\'></textarea><button class="btn claro" data-x="paste">Importar texto pegado</button><button class="btn borde" data-x="c">Cerrar</button>');
  m.querySelector('[data-x="c"]').onclick = () => m.remove();
  m.querySelector('[data-x="file"]').onclick = () => { m.remove(); document.getElementById("pkgIn").click(); };
  m.querySelector('[data-x="paste"]').onclick = () => { const t = m.querySelector("#pkgTxt").value; m.remove(); importarTexto(t); };
}
async function onPkgFile(ev){ const f = ev.target.files[0]; ev.target.value = ""; if (f) importarTexto(await f.text()); }
async function importarTexto(txt){
  let d; try { const a = txt.indexOf("{"), b = txt.lastIndexOf("}"); d = JSON.parse(txt.slice(a, b + 1)); } catch(e){ toast("Ese texto no es un paquete válido", 3500); return; }
  if (!d || d.app !== "espiga-frases") { toast("Ese archivo no es un paquete de frases de Espiga Social", 3500); return; }
  const n = await importarObjeto(d);
  const hist = (await kvGet("paquetes")) || []; hist.push({ titulo: d.titulo || "", fecha: new Date().toISOString(), nuevas: n }); await kvSet("paquetes", hist.slice(-30));
  toast("✅ Paquete " + (d.titulo ? "\"" + d.titulo + "\" " : "") + "importado: " + n + " frases nuevas", 4000);
  render();
}
async function importarObjeto(d){
  const B = S.banco; let n = 0;
  const limpio = t => typeof t === "string" ? t.trim().slice(0, 600) : "";
  const agregar = (lista, t) => { t = limpio(t); if (t && !lista.includes(t)) { lista.push(t); n++; } };
  (d.ganchos || []).forEach(g => { const t = limpio(g && g.t), m = ["manana","mediodia","tarde","*"].includes(g && g.m) ? g.m : "*"; if (t && !B.ganchos.some(x => x.t === t)) { B.ganchos.push({ m, t }); n++; } });
  Object.entries(d.productos || {}).forEach(([k, p]) => {
    let pr = B.productos[k];
    if (!pr) { if (!p || !p.nombre || !B.categorias[p.cat]) return; pr = B.productos[k] = { nombre: limpio(p.nombre), cat: p.cat, claves: (p.claves || []).map(limpio).filter(Boolean), tags: limpio(p.tags), ganchos: [], frases: [] }; }
    (p.ganchos || []).forEach(t => agregar(pr.ganchos = pr.ganchos || [], t));
    (p.frases || []).forEach(t => agregar(pr.frases = pr.frases || [], t));
  });
  (d.generales || []).forEach(t => agregar(B.cuerpos.general, t));
  (d.preguntas || []).forEach(t => agregar(B.preguntas, t));
  (d.cierres || []).forEach(t => agregar(B.cierres, t));
  (d.fechas || []).forEach(f => {
    if (!f || !Array.isArray(f.frases)) return;
    let x = B.fechas.find(y => y.id === f.id) || B.fechas.find(y => y.nombre === f.nombre);
    const okMD = v => /^\d{2}-\d{2}$/.test(v || "");
    if (!x) { if (!okMD(f.desde) || !okMD(f.hasta)) return; x = { id: limpio(f.id) || uid(), nombre: limpio(f.nombre) || "Fecha especial", desde: f.desde, hasta: f.hasta, frases: [] }; B.fechas.push(x); }
    f.frases.forEach(t => agregar(x.frases, t));
  });
  await guardarBanco();
  return n;
}

/* ===================== Respaldo ===================== */
const blobADataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
async function respaldo(){
  toast("Preparando respaldo…");
  const fotos = []; for (const f of S.fotos) fotos.push({ id: f.id, categoria: f.categoria, prod: f.prod || "", producto: f.producto, creada: f.creada, data: await blobADataURL(f.blob) });
  const json = JSON.stringify({ app: "espiga-social", version: 1, fecha: new Date().toISOString(), cfg: S.cfg, banco: S.banco, posts: S.posts, tareas: S.tareas, mkt: S.mkt, caja: S.caja, hechos: S.hechos, fotos });
  descargar("respaldo-espiga-" + hoyStr() + ".json", new Blob([json], { type: "application/json" }));
}
async function restaurar(ev){
  const file = ev.target.files[0]; ev.target.value = ""; if (!file) return;
  let d; try { d = JSON.parse(await file.text()); } catch(e){ toast("Ese archivo no es un respaldo válido"); return; }
  if (!d || d.app !== "espiga-social") { toast("Ese archivo no es un respaldo de Espiga Social"); return; }
  if (!await confirmar("Esto reemplaza lo que hay en la app por el respaldo del " + (d.fecha || "").slice(0, 10) + ". ¿Continuar?", "Restaurar")) return;
  await tx("fotos", "readwrite", s => s.clear());
  const fotos = [];
  for (const f of d.fotos || []) { const blob = await (await fetch(f.data)).blob(); const x = { id: f.id, categoria: f.categoria, prod: f.prod || "", producto: f.producto, creada: f.creada, blob }; await fotoPut(x); fotos.push(x); }
  S.cfg = Object.assign(clone(DEFAULT_CFG), d.cfg || {}); S.banco = d.banco || clone(BANCO_INICIAL); if (S.banco.version !== BANCO_INICIAL.version) { S.banco.productos = clone(BANCO_INICIAL.productos); S.banco.version = BANCO_INICIAL.version; } S.posts = d.posts || []; S.tareas = d.tareas || []; await kvSet("tareas", S.tareas); S.mkt = Object.assign(clone(MKT_DEF), d.mkt || {}); S.caja = d.caja || {}; S.hechos = d.hechos || {}; await kvSet("mkt", S.mkt); await kvSet("caja", S.caja); await kvSet("hechos", S.hechos);
  Object.values(S.urls).forEach(u => URL.revokeObjectURL(u)); S.urls = {}; S.fotos = fotos.sort((a,b) => (b.creada||"").localeCompare(a.creada||""));
  await guardarCfg(); await guardarBanco(); await guardarPosts(); toast("✅ Respaldo restaurado"); render();
}

/* ===================== Inicio ===================== */
async function init(){
  try { IDB = await abrirDB(); }
  catch(e){ $app.innerHTML = '<div class="aviso">Este navegador no permite guardar datos (¿modo privado?). Abre la app en Safari normal.</div>'; return; }
  S.cfg = Object.assign(clone(DEFAULT_CFG), (await kvGet("cfg")) || {});
  S.banco = (await kvGet("banco")) || clone(BANCO_INICIAL);
  if (S.banco.version !== BANCO_INICIAL.version) { S.banco.productos = clone(BANCO_INICIAL.productos); S.banco.version = BANCO_INICIAL.version; await guardarBanco(); }
  S.posts = (await kvGet("posts")) || [];
  S.usados = (await kvGet("usados")) || [];
  S.ia = (await kvGet("ia")) || null;
  S.ajustes = (await kvGet("ajustes")) || [];
  S.tareas = (await kvGet("tareas")) || [];
  S.mkt = Object.assign(clone(MKT_DEF), (await kvGet("mkt")) || {}); S.caja = (await kvGet("caja")) || {}; S.hechos = (await kvGet("hechos")) || {};
  setTimeout(() => renovarSiToca().catch(() => {}), 5000);
  S.fotos = ((await fotosAll()) || []).sort((a,b) => (b.creada||"").localeCompare(a.creada||""));
  for (const f of S.fotos) if (f.prod === undefined) { f.prod = adivinarProd(f.producto, f.categoria); const p = prodDe(f); if (p) f.categoria = p.cat; await fotoPut(f); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  S.gh = (await kvGet("gh")) || {};
  robotCargar().then(() => { if (!S.editing && !document.querySelector(".modal")) render(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) robotCargar().then(() => { if (vista() === "hoy" && !document.querySelector(".modal")) render(); }); });
  S.fb = (await kvGet("fb")) || null; S.fbUltima = (await kvGet("fbUltima")) || 0;
  await fbActualizarEstados();
  if (S.fb && Date.now() - S.fbUltima > 6 * 3600000) setTimeout(() => fbTraerResultados(true).catch(() => {}), 3000);
  window.addEventListener("hashchange", render);
  document.getElementById("fileIn").addEventListener("change", onFiles);
  document.getElementById("restIn").addEventListener("change", restaurar);
  document.getElementById("pkgIn").addEventListener("change", onPkgFile);
  document.getElementById("tarIn").addEventListener("change", onTareasCaptura);
  setInterval(async () => { const cambio = await fbActualizarEstados(); const ae = document.activeElement; if ((cambio || vista() === "hoy") && !document.querySelector(".modal") && !S.editing && !(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) render(); }, 60000);
  render();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
init();
</script>
