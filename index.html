<title>La Espiga Dorada</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F5F6F3;color:#16201B;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:0;font-weight:700}
button,input,select{font-family:inherit;font-size:16px;color:#16201B}
button{min-height:44px;border-radius:12px;border:1px solid #D5DBD3;background:#fff;padding:0 14px;cursor:pointer}
button:active{transform:scale(.98)}
input,select{height:44px;border-radius:10px;border:1px solid #D5DBD3;background:#fff;padding:0 10px;width:100%}
input:focus,select:focus{outline:2px solid #0F7A4F;outline-offset:0}
.pri{background:#0F7A4F;color:#fff;border-color:transparent;font-weight:600}
.dark{background:#16201B;color:#fff;border-color:transparent;font-weight:600}
.danger{color:#B42318;border-color:#F3C5C0}
.w{width:100%}
.cd{background:#fff;border:1px solid #E4E8E2;border-radius:16px;padding:14px}
.mt{background:#fff;border:1px solid #E4E8E2;border-radius:12px;padding:12px}
.mt small{display:block;font-size:12px;color:#5B6660}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bd{display:inline-block;font-size:12px;padding:2px 8px;border-radius:8px;background:#ECEEEA;color:#3D4842;margin:4px 4px 0 0}
.bs{background:#E3F1EA;color:#0B5C3B}.bw{background:#FFF0E0;color:#8A3D05}.bp{background:#EEEAFB;color:#4B3A9A}
.debe{color:#A44A06}.ok{color:#0F7A4F}
.sec{font-size:14px;color:#5B6660;margin:20px 0 8px;font-weight:600}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0}
.err{font-size:14px;color:#B42318;min-height:4px;margin:6px 0}
.fl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-size:15px;border-bottom:1px solid #E4E8E2}
.fl input{width:96px;text-align:right}
.gi{text-align:right;padding:0 6px;height:42px}
.gh{font-size:11px;color:#5B6660;text-align:right;line-height:1.3}
.av{width:42px;height:42px;border-radius:50%;background:#E3F1EA;color:#0F7A4F;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.row{width:100%;height:auto;text-align:left;display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;border-radius:14px;border:1px solid #E4E8E2;background:#fff}
.sg{display:grid;gap:4px;background:#E7EAE5;padding:4px;border-radius:12px;margin:12px 0}
.sg button{border:none;font-size:14px;min-height:38px;background:transparent;padding:0 4px}
.sg button.on{background:#fff;font-weight:600}
.hero{background:#0F7A4F;color:#fff;border-radius:20px;padding:18px;margin:14px 0 10px}
.hero .big{font-size:32px;font-weight:700}
.warn{background:#FFF0E0;color:#8A3D05;border-radius:12px;padding:12px;font-size:14px;margin:12px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E4E8E2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:4px 0 calc(4px + env(safe-area-inset-bottom));z-index:5}
nav button{border:none;background:transparent;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;color:#5B6660;border-radius:0}
nav button.on{color:#0F7A4F;font-weight:700}
nav svg{width:24px;height:24px}
.ico{width:20px;height:20px;vertical-align:-4px}
#ticket{background:#fff;border:1px dashed #9AA39D;border-radius:6px;padding:16px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#000;max-width:340px;margin:12px auto}
#ticket .c{text-align:center}#ticket .tl{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
#ticket hr{border:none;border-top:1px dashed #000;margin:8px 0}#ticket .gr{font-size:15px;font-weight:700}
@media print{@page{size:58mm auto;margin:2mm}body{background:#fff}nav,#app>*:not(#ticket){display:none!important}#app{padding:0}#ticket{border:none;max-width:none;margin:0;padding:0;font-size:11px}}
</style>
</head>
<body>

function pMayoreo(){if(!cli(U.mc))U.mc=D.CL.length?D.CL.slice().sort(function(a,b){return a.n.localeCompare(b.n)})[0].id:null;
var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h1>Mayoreo y menudeo</h1><button onclick="U.add=!U.add;render()">'+svg(U.add?'x':'plus')+' Cliente</button></div>';
if(U.add)h+='<div class="cd" style="margin-bottom:12px"><div style="font-weight:600;margin-bottom:8px">Cliente que no lleva tortilla</div><input id="nn" placeholder="Nombre del cliente" style="margin-bottom:8px" oninput="$(\'cerr\').textContent=\'\'" aria-label="Nombre"><label style="display:flex;gap:8px;align-items:center;font-size:15px;margin-bottom:8px"><input type="checkbox" id="nc" style="width:22px;height:22px"> Tiene crédito</label><div class="err" id="cerr"></div><button class="w pri" onclick="addCli(\'ext\')">Agregar cliente</button></div>';
if(U.mc!==null)h+=mform(mcli(),true);
var cu=D.CL.filter(function(c){return c.sM||envTxt(c)});
h+='<div class="sec">Cuentas de mayoreo y menudeo</div>'+(cu.length?cu.map(function(c){return '<button class="row" id="mrow'+c.id+'" onclick="abrir('+c.id+',\'may\')" style="justify-content:space-between"><span><b style="font-weight:600">'+esc(c.n)+'</b><br><span style="font-size:12px;color:#5B6660">'+tipoTxt(c)+(c.cred?' · con crédito':'')+'</span>'+(envTxt(c)?'<br><span style="font-size:13px;color:#8A3D05">Debe cajas: '+esc(envTxt(c))+'</span>':'')+'</span><b class="'+(c.sM>0?'debe':'')+'">'+m(c.sM)+'</b></button>'}).join(''):'<div style="font-size:14px;color:#5B6660">Nadie debe. Cuando un cliente paga todo y regresa sus cajas, sale de esta lista.</div>');
return h+movs(null)}

/* ---------- Precios especiales por cliente ---------- */
function precMay(c){if(!D.PR.length)return '<div style="font-size:14px;color:#5B6660">Agrega tus productos en Precios → Productos.</div>';
var as=[],lib=[];D.PR.forEach(function(p){['may','pz'].forEach(function(t){if(!tieneT(p,t))return;var k=t==='pz'?p.id+'#pz':p.id;(c.pm[k]!==undefined?as:lib).push({p:p,t:t,k:k})})});
var h=as.length?as.map(function(x){return '<div class="fl"><span>'+esc(x.p.n)+'<br><span style="color:#5B6660;font-size:13px">'+(x.t==='pz'?'Menudeo':'Mayoreo')+' por '+esc(uV(x.p,x.t))+' · general '+m(N(x.t==='pz'?x.p.pz:x.p.p))+'</span></span><span style="display:flex;gap:6px;align-items:center"><input type="text" inputmode="decimal" autocomplete="off" value="'+c.pm[x.k]+'" onchange="setPM(\''+x.k+'\',this.value)" aria-label="Precio de '+esc(x.p.n)+'" style="width:96px;text-align:right"><button aria-label="Quitar precio de '+esc(x.p.n)+'" onclick="quitarPM(\''+x.k+'\')" style="padding:0 10px">'+svg('x')+'</button></span></div>'}).join(''):'<div style="font-size:14px;color:#5B6660;padding:4px 0">No tiene precios especiales. Paga el precio general de todos los productos.</div>';
if(lib.length){var cs=cats();h+='<div style="display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px;margin-top:10px"><select id="apP" aria-label="Producto"><option value="">Elige un producto</option>'+cs.map(function(ct){var L=lib.filter(function(x){return catDe(x.p)===ct});return L.length?'<optgroup label="'+esc(ct)+'">'+L.map(function(x){return '<option value="'+x.k+'">'+esc(x.p.n)+' · '+(x.t==='pz'?'menudeo':'mayoreo')+' (general '+m(N(x.t==='pz'?x.p.pz:x.p.p))+')</option>'}).join('')+'</optgroup>':''}).join('')+'</select><input id="apV" type="text" inputmode="decimal" autocomplete="off" placeholder="Precio" aria-label="Precio especial" style="text-align:right"></div><div class="err" id="aperr"></div><button class="w" onclick="asignarPM()">'+svg('plus')+' Asignar precio especial</button>'}
return h}
function asignarPM(){var k=$('apP').value,x=$('apV').value;if(!k){$('aperr').textContent='Elige un producto.';return}if(!(N(x)>0)){$('aperr').textContent='Escribe el precio.';return}cli(U.cli).pm[k]=N(x);guardar();render()}
function quitarPM(k){delete cli(U.cli).pm[k];guardar();render()}
function setPM(k,x){var c=cli(U.cli);if(x==='')delete c.pm[k];else c.pm[k]=N(x);guardar()}

/* ---------- Precios ---------- */
function pPrecios(){var pt=U.pt==='tor'?'tor':'prod';var h='<div class="sg" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:0">'+[['prod','Productos'],['tor','Tortilla']].map(function(x){return '<button onclick="U.pt=\''+x[0]+'\';U.conf=null;U.ep=null;render()" class="'+(pt===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>';
if(pt==='tor')return h+'<h1>Precios de tortilla</h1><div style="font-size:14px;color:#5B6660;margin-top:4px">Precio general por kg. Los precios de cada cliente están en su página.</div><div class="cd" style="padding:4px 14px;margin-top:12px">'+K.map(function(k){return pin(D.TP[k].n,D.TP[k].p,'0','D.TP.'+k+'.p=N(this.value);guardar()')}).join('')+'</div>';
h+='<div style="display:flex;justify-content:space-between;align-items:center"><h1>Productos</h1><button onclick="U.ep=U.ep===\'nuevo\'?null:\'nuevo\';U.conf=null;render()">'+svg(U.ep==='nuevo'?'x':'plus')+' Producto</button></div>';
if(U.ep==='nuevo')h+=formProd(null);
h+='<input id="cbM" value="'+esc(U.qp||'')+'" placeholder="Buscar: nombre, código o categoría" '+CBA+' oninput="U.qp=this.value;listaProd()" aria-label="Buscar producto" style="margin-top:12px">';
var cs=cats(),cf=U.cf&&cs.indexOf(U.cf)>=0?U.cf:'';
h+='<div style="display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px">'+[['','Todas']].concat(cs.map(function(c){return[c,c]})).map(function(x){return '<button onclick="U.cf=\''+esc(x[0]).replace(/'/g,'&#39;')+'\';listaProd();marcaCat(this)" class="chip'+(cf===x[0]?' on':'')+'" style="flex-shrink:0;min-height:36px;border-radius:18px;font-size:14px;padding:0 14px;'+(cf===x[0]?'background:#16201B;color:#fff;border-color:transparent':'')+'">'+esc(x[1])+'</button>'}).join('')+'</div><div id="lp">'+filasProd()+'</div>';
h+='<div class="sec">Categorías</div><div class="cd" style="padding:4px 14px">'+cs.map(function(c,i){var n=D.PR.filter(function(p){return catDe(p)===c}).length,k='cat'+i;return '<div class="fl"><span>'+esc(c)+' <span style="color:#5B6660;font-size:13px">('+n+')</span></span>'+(n||c==='Sin categoría'?'':'<button onclick="dosToques(\''+k+'\',function(){borrarCat('+i+')})" class="'+(U.conf===k?'danger':'')+'" style="padding:0 10px;min-height:36px">'+(U.conf===k?'¿Quitar?':svg('x'))+'</button>')+'</div>'}).join('')+'<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 0"><input id="ncat" placeholder="Nueva categoría, ej. Dulces" aria-label="Nueva categoría"><button onclick="addCat()">Agregar</button></div><div class="err" id="caterr"></div></div>';
return h}
function marcaCat(b){var bs=b.parentNode.children;for(var i=0;i<bs.length;i++){bs[i].style.background='';bs[i].style.color='';bs[i].style.borderColor=''}b.style.background='#16201B';b.style.color='#fff';b.style.borderColor='transparent'}
function listaProd(){var e=$('lp');if(e)e.innerHTML=filasProd()}
function filasProd(){var q=(U.qp||'').trim(),L=q?busca(q,500):D.PR.slice(),cs=cats(),cf=U.cf&&cs.indexOf(U.cf)>=0?U.cf:'';if(cf)L=L.filter(function(p){return catDe(p)===cf});
if(!D.PR.length)return '<div style="font-size:14px;color:#5B6660;padding:8px 0">Todavía no hay productos. Toca <b>+ Producto</b> para agregar el primero.</div>';
if(!L.length)return '<div style="font-size:14px;color:#5B6660;padding:8px 0">No se encontró ningún producto.</div>';
var G=q?[['',L]]:cs.map(function(c){return[c,L.filter(function(p){return catDe(p)===c}).sort(function(a,b){return a.n.localeCompare(b.n)})]}).filter(function(g){return g[1].length});
return G.map(function(g){return (g[0]?'<div style="font-size:13px;font-weight:600;color:#0F7A4F;margin:12px 0 4px">'+esc(g[0])+'</div>':'')+'<div class="cd" style="padding:2px 12px">'+g[1].map(function(p){return U.ep===p.id?formProd(p):'<button onclick="U.ep=\''+p.id+'\';U.conf=null;render()" style="width:100%;height:auto;text-align:left;border:none;border-bottom:1px solid #E4E8E2;border-radius:0;padding:10px 0;display:flex;justify-content:space-between;gap:10px;background:transparent"><span><b style="font-weight:600">'+esc(p.n)+'</b>'+(q?' <span style="font-size:12px;color:#5B6660">· '+esc(catDe(p))+'</span>':'')+'<br><span style="font-size:12px;color:#5B6660">'+(p.cb?'Código '+esc(p.cb):'Sin código')+(p.ret?' · retornable':'')+'</span></span><span style="text-align:right;font-size:13px;white-space:nowrap">'+(tieneT(p,'may')?'Mayoreo <b>'+m(N(p.p))+'</b>/'+esc(uV(p,'may'))+'<br>':'')+(tieneT(p,'pz')?'Menudeo <b>'+m(N(p.pz))+'</b>/'+esc(uV(p,'pz')):'')+'</span></button>'}).join('')+'</div>'}).join('')}
function opts(L,cur){return L.map(function(u){return '<option'+(u===cur?' selected':'')+'>'+u+'</option>'}).join('')}
function formProd(p){var x=p||{},cs=cats(),cur=p?catDe(p):(U.cf||cs[0]||'Sin categoría'),k='bp'+(p?p.id:'');
return '<div class="cd" style="margin:10px 0;border-color:#0F7A4F"><div style="font-weight:600;margin-bottom:8px">'+(p?'Editar producto':'Nuevo producto')+'</div>'+
'<input id="f_n" value="'+esc(x.n||'')+'" placeholder="Nombre, ej. Coca-Cola 600 ml" aria-label="Nombre" style="margin-bottom:8px">'+
'<select id="f_cat" aria-label="Categoría" onchange="$(\'f_catn\').style.display=this.value===\'__new\'?\'block\':\'none\'" style="margin-bottom:8px">'+cs.map(function(c){return '<option'+(c===cur?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'<option value="__new">+ Nueva categoría…</option></select><input id="f_catn" placeholder="Nombre de la nueva categoría" style="display:none;margin-bottom:8px" aria-label="Nueva categoría">'+
'<input id="f_cb" value="'+esc(x.cb||'')+'" placeholder="Código de barras (opcional)" '+CBA+' aria-label="Código de barras" style="margin-bottom:10px">'+
'<div style="font-size:13px;font-weight:600;color:#5B6660">Mayoreo</div><div class="g2" style="margin:4px 0 10px"><select id="f_u" aria-label="Unidad de mayoreo">'+opts(UM,x.u||'caja')+'</select><input id="f_p" type="text" inputmode="decimal" autocomplete="off" value="'+(tieneT(x,'may')?x.p:'')+'" placeholder="Precio $ (opcional)" aria-label="Precio de mayoreo" style="text-align:right"></div>'+
'<div style="font-size:13px;font-weight:600;color:#5B6660">Menudeo</div><div class="g2" style="margin:4px 0 10px"><select id="f_uz" aria-label="Unidad de menudeo">'+opts(UZ,x.upz||'pieza')+'</select><input id="f_pz" type="text" inputmode="decimal" autocomplete="off" value="'+(tieneT(x,'pz')?x.pz:'')+'" placeholder="Precio $ (opcional)" aria-label="Precio de menudeo" style="text-align:right"></div>'+
'<label style="display:flex;gap:8px;align-items:center;font-size:15px;margin-bottom:6px"><input type="checkbox" id="f_ret" style="width:22px;height:22px"'+(x.ret?' checked':'')+'> Es retornable (se presta la caja o envase)</label><div class="err" id="f_err"></div>'+
'<div class="g2"><button class="pri" onclick="guardarProd('+(p?'\''+p.id+'\'':'null')+')">Guardar</button><button onclick="U.ep=null;U.conf=null;render()">Cancelar</button></div>'+
(p?'<button class="w danger" style="margin-top:8px" onclick="dosToques(\''+k+'\',function(){borrarProd(\''+p.id+'\')})">'+(U.conf===k?'Toca otra vez para borrar '+esc(p.n):'Borrar producto')+'</button>':'')+'</div>'}
function guardarProd(id){var n=$('f_n').value.trim(),err=$('f_err'),ps=$('f_p').value.trim(),pzs=$('f_pz').value.trim();
if(!n){err.textContent='Escribe el nombre del producto.';return}
if(!ps&&!pzs){err.textContent='Pon al menos un precio: de mayoreo, de menudeo o los dos.';return}
var cat=$('f_cat').value;if(cat==='__new'){cat=$('f_catn').value.trim();if(!cat){err.textContent='Escribe el nombre de la nueva categoría.';return}D.CAT=D.CAT||[];if(D.CAT.indexOf(cat)<0)D.CAT.push(cat)}
var cb=normCB($('f_cb').value),dd=cb&&D.PR.find(function(q){return q.cb===cb&&q.id!==id});if(dd){err.textContent='Ese código ya lo tiene '+dd.n+'.';return}
var p=id?prod(id):{id:'p'+Date.now()};p.n=n;p.cat=cat==='Sin categoría'?'':cat;p.cb=cb;p.u=$('f_u').value;p.p=ps?N(ps):null;p.upz=$('f_uz').value;p.pz=pzs?N(pzs):null;p.ret=$('f_ret').checked;
if(!id)D.PR.push(p);U.ep=null;U.cf=p.cat||'Sin categoría';guardar();render()}
function borrarProd(id){D.PR=D.PR.filter(function(p){return p.id!==id});U.ep=null;guardar();render()}
function addCat(){var n=$('ncat').value.trim();if(!n){$('caterr').textContent='Escribe el nombre.';return}D.CAT=D.CAT||[];if(cats().indexOf(n)>=0){$('caterr').textContent='Esa categoría ya existe.';return}D.CAT.push(n);guardar();render()}
function borrarCat(i){var c=cats()[i];D.CAT=(D.CAT||[]).filter(function(x){return x!==c});if(U.cf===c)U.cf='';guardar();render()}

document.addEventListener('focusin',function(ev){var x=ev.target;if(x&&x.tagName==='INPUT'&&x.getAttribute('inputmode')==='decimal'){if(x.value==='0')x.value='';setTimeout(function(){var n=x.value.length;try{x.setSelectionRange(n,n)}catch(e){}},0)}});
cargar();guardar();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
render();
